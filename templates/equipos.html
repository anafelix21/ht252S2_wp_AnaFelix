<!-- 
============================================
ARCHIVO: equipos.html
DESCRIPCIÓN: Página de visualización y gestión de equipos registrados
FUNCIÓN: Muestra tabla con todos los equipos, permite editar y eliminar
TECNOLOGÍAS: HTML5, CSS3, JavaScript
============================================
-->
<!DOCTYPE html>
<html lang="es">
<head>
    <!-- ============================================
         METADATOS Y CONFIGURACIÓN
         ============================================ -->
    <!-- Codificación UTF-8 -->
    <meta charset="UTF-8">
    
    <!-- Configuración responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Título de la página -->
    <title>Equipos Registrados</title>
    
    <!-- Importación de hojas de estilos
         output.css: Estilos base de Tailwind
         equipos.css: Estilos específicos de esta página -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/equipos.css') }}">
</head>
<body>
    <!-- ============================================
         CONTENEDOR PRINCIPAL
         ============================================ -->
    <div class="container">
        
        <!-- ============================================
             ENCABEZADO DE LA PÁGINA
             ============================================
             Contiene título y botón para volver -->
        <div class="header">
            <!-- Título con emoji para mejor UX -->
            <h1>📋 Equipos Informaticos Registrados</h1>
            
            <!-- Enlace para volver a la página de registro
                 url_for('index') genera la ruta / dinámicamente -->
            <a href="{{ url_for('index') }}" class="btn-volver">← Volver al Registro</a>
        </div>

        <!-- ============================================
             CONTENEDOR DE LISTA DE EQUIPOS
             ============================================
             Este div se llena dinámicamente con JavaScript
             Al cargar muestra "Cargando equipos..."
             Después se reemplaza con la tabla generada o mensaje de error -->
        <div id="listaEquipos" class="lista-equipos">
            <div class="cargando">Cargando equipos...</div>
        </div>
    </div>

    <!-- ============================================
         MODAL DE EDICIÓN
         ============================================
         Ventana emergente para editar equipos
         Inicialmente oculto (display: none en CSS)
         Se muestra al hacer clic en botón "Editar" de un equipo -->
    <div id="modalEditar" class="modal">
        
        <!-- Contenedor del contenido del modal -->
        <div class="modal-content">
            
            <!-- ============================================
                 ENCABEZADO DEL MODAL
                 ============================================ -->
            <div class="modal-header">
                <h2>Editar Equipo</h2>
                <!-- Botón X para cerrar el modal
                     onclick llama a la función cerrarModal() de equipos.js -->
                <span class="cerrar" onclick="cerrarModal()">&times;</span>
            </div>
            
            <!-- ============================================
                 FORMULARIO DE EDICIÓN
                 ============================================
                 Se llena automáticamente con los datos del equipo seleccionado
                 El envío es manejado por equipos.js (preventDefault) -->
            <form id="formEditar" class="modal-form">
                
                <!-- Grid de campos del formulario -->
                <div class="form-grid">
                    
                    <!-- Campo: Código del equipo -->
                    <div class="form-group">
                        <label for="editCodigo">Código:</label>
                        <input type="text" id="editCodigo" name="codigo" required>
                    </div>
                    
                    <!-- Campo: Tipo de equipo -->
                    <div class="form-group">
                        <label for="editTipo">Tipo:</label>
                        <input type="text" id="editTipo" name="tipo" required>
                    </div>
                    
                    <!-- Campo: Marca -->
                    <div class="form-group">
                        <label for="editMarcas">Marca:</label>
                        <input type="text" id="editMarcas" name="marcas" required>
                    </div>
                    
                    <!-- Campo: Modelo -->
                    <div class="form-group">
                        <label for="editModelo">Modelo:</label>
                        <input type="text" id="editModelo" name="modelo" required>
                    </div>
                    
                    <!-- Campo: Sistema Operativo -->
                    <div class="form-group">
                        <label for="editSO">Sistema Operativo:</label>
                        <input type="text" id="editSO" name="so" required>
                    </div>
                    
                    <!-- Campo: Almacenamiento en GB -->
                    <div class="form-group">
                        <label for="editAlmacenamiento">Almacenamiento (GB):</label>
                        <input type="number" id="editAlmacenamiento" name="almacenamiento" required>
                    </div>
                    
                    <!-- Campo: Memoria RAM en GB -->
                    <div class="form-group">
                        <label for="editRam">RAM (GB):</label>
                        <input type="number" id="editRam" name="ram" required>
                    </div>
                    
                    <!-- Campo: Estado del equipo -->
                    <div class="form-group">
                        <label for="editEstado">Estado:</label>
                        <select id="editEstado" name="estado" required>
                            <option value="">Seleccionar...</option>
                            <option value="Activo">Activo</option>
                            <option value="Inactivo">Inactivo</option>
                            <option value="Mantenimiento">En Mantenimiento</option>
                            <option value="Defectuoso">Defectuoso</option>
                        </select>
                    </div>
                    
                    <!-- Campo: Fecha de mantenimiento -->
                    <div class="form-group">
                        <label for="editMantenimiento">Fecha de Mantenimiento:</label>
                        <input type="date" id="editMantenimiento" name="mantenimiento" required>
                    </div>
                </div>
                
                <!-- ============================================
                     PIE DEL MODAL - BOTONES DE ACCIÓN
                     ============================================ -->
                <div class="modal-footer">
                    <!-- Botón para guardar cambios
                         type="submit" envía el formulario
                         Manejado por equipos.js para hacer PUT a la API -->
                    <button type="submit" class="btn-guardar">💾 Guardar Cambios</button>
                    
                    <!-- Botón para cancelar y cerrar modal
                         type="button" evita envío del formulario -->
                    <button type="button" class="btn-cancelar" onclick="cerrarModal()">✕ Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ============================================
         IMPORTACIÓN DE JAVASCRIPT
         ============================================
         Archivo: equipos.js
         Funciones principales:
         - Cargar y mostrar tabla de equipos
         - Abrir/cerrar modal de edición
         - Actualizar equipo (PUT)
         - Eliminar equipo (DELETE)
         - Generar HTML dinámico de la tabla -->
    <script src="{{ url_for('static', filename='js/equipos.js') }}"></script>
</body>
</html>
