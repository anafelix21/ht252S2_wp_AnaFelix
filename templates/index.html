<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido - Registro de Equipos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <img src="/static/image/logo.jpg" alt="Logo">
            <h1>Bienvenido</h1>
        </div>

        <form id="equipoForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="codigo">Código</label>
                    <input type="text" id="codigo" name="codigo" required>
                </div>
                <div class="form-group">
                    <label for="tipo">Tipo de equipo</label>
                    <select id="tipo" name="tipo" required>
                        <option value="">Seleccionar...</option>
                        <option value="Laptop">Laptop</option>
                        <option value="Desktop">Desktop</option>
                        <option value="Servidor">Servidor</option>
                        <option value="Impresora">Impresora</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="marcas">Marcas</label>
                    <select id="marcas" name="marcas" required>
                        <option value="">Seleccionar...</option>
                        <option value="HP">HP</option>
                        <option value="Dell">Dell</option>
                        <option value="Lenovo">Lenovo</option>
                        <option value="ASUS">ASUS</option>
                        <option value="Apple">Apple</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="modelo">Modelo</label>
                    <select id="modelo" name="modelo" required>
                        <option value="">Seleccionar...</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="so">Sistema Operativo</label>
                    <select id="so" name="so" required>
                        <option value="">Seleccionar...</option>
                        <option value="Windows 10">Windows 10</option>
                        <option value="Windows 11">Windows 11</option>
                        <option value="macOS">macOS</option>
                        <option value="Linux">Linux</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="almacenamiento">Almacenamiento (GB)</label>
                    <input type="number" id="almacenamiento" name="almacenamiento" min="1" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="ram">Ram</label>
                    <input type="number" id="ram" name="ram" min="1" required>
                </div>
                <div class="form-group">
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado" required>
                        <option value="">Seleccionar...</option>
                        <option value="Activo">Activo</option>
                        <option value="Inactivo">Inactivo</option>
                        <option value="Mantenimiento">Mantenimiento</option>
                        <option value="Defectuoso">Defectuoso</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="mantenimiento">Fecha de Mantenimiento</label>
                    <input type="date" id="mantenimiento" name="mantenimiento" required min="{{ today }}">
                </div>
            </div>

            <button type="submit">Registrar</button>
            <button type="button" id="verEquiposBtn" class="btn-secondary">Ver Equipos Registrados</button>
        </form>
        <div id="mensaje" class="mensaje"></div>
    </div>

    <script src="{{ url_for('static', filename='js/form.js') }}"></script>
</body>
</html>
